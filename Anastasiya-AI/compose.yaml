name: anastasiya-ai
x-app: &app
  image: anastasiya-ai:local
  env_file:
    - path: .env
      format: raw
  init: true
  restart: unless-stopped
  stop_grace_period: 45s
  volumes:
    - ./data:/app/data
    - ./config:/app/config:ro
services:
  listener:
    <<: *app
    build: .
    command: ["python", "scripts/launch.py", "main", "listen"]
    stop_signal: SIGINT
  panel:
    <<: *app
    command: ["python", "scripts/launch.py", "admin_panel"]
    networks: [panel-net]
    ports:
      - "127.0.0.1:8765:8766"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
  panel-gateway:
    image: nginx:stable-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    network_mode: service:panel
    depends_on:
      panel:
        condition: service_healthy
        restart: true
    volumes:
      - ./panel-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
networks:
  panel-net: {}
